<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>CN7 대시</title>
<style>
:root{
  --bg:#0b0d10; --panel:#14181d; --panel2:#1b2027; --line:#262c35;
  --text:#e9edf2; --dim:#8a94a3; --faint:#5a6472;
  --ok:#3ddc84; --warn:#ffb020; --hot:#ff4d4d; --accent:#4da3ff; --cand:#a98bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif}
body{padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 92px)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--ok)} .dot.off{background:var(--hot)}
.rec{margin-left:auto;display:none;align-items:center;gap:6px;color:var(--hot);font-weight:600}
.rec.on{display:flex} .rec i{width:9px;height:9px;border-radius:50%;background:var(--hot);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.hero{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.rpm{font-size:56px;font-weight:700;letter-spacing:-1px;line-height:1}
.unit{font-size:12px;color:var(--dim);margin-left:4px;font-weight:500}
.gear{font-size:64px;font-weight:800;line-height:1;text-align:center;min-width:64px}
.spd{font-size:22px;font-weight:600;margin-top:4px}
.shift{display:grid;grid-template-columns:repeat(28,1fr);gap:2px;margin-top:10px}

.scale{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:3px}
.shift b{height:14px;border-radius:2px;background:var(--panel2)}
.shift b.g{background:var(--ok)} .shift b.y{background:var(--warn)} .shift b.r{background:var(--hot)}
.shift.flash b{background:var(--hot)!important;animation:bl .15s infinite}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:78px;gap:8px;margin-top:8px}
.t{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:64px}
.t .l{font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
.t .v{font-size:24px;font-weight:650;margin-top:2px}
.t.strong .l::after{content:"유력";color:var(--accent);font-size:10px}
.t.cand .l::after{content:"후보";color:var(--cand);font-size:10px}
.t.weak .l::after{content:"약함";color:var(--faint);font-size:10px}
.t.warn .v{color:var(--warn)} .t.hot .v{color:var(--hot)}
.t{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.t .v .unit{font-size:12px}
.t.wide{grid-column:span 2}
.wheelrow{display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:nowrap;white-space:nowrap}
.wheel{width:34px;height:34px;color:var(--text);flex:none;transition:transform .08s linear}
#steerv{font-size:18px;margin:0;white-space:nowrap}
#steerv .unit{font-size:11px}
.tbar{height:6px;background:var(--panel2);border-radius:3px;margin-top:auto;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.row2>.card{display:flex;flex-direction:column}
.tp{position:relative;flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;margin-top:8px}
.tire{position:relative;background:var(--panel2);border-radius:10px;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.tire::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--faint)}
.tire b{font-size:28px;font-weight:700;line-height:1}
.tire small{font-size:10px;color:var(--dim);margin-top:3px}
.tire.ok::after{background:var(--ok)} .tire.lo::after,.tire.hi::after{background:var(--warn)} .tire.bad::after{background:var(--hot)}
.tire.lo b,.tire.hi b{color:var(--warn)} .tire.bad b{color:var(--hot)}
.tire.bad{animation:bl 1s infinite}
.gball{position:relative;width:100%;aspect-ratio:1;max-width:150px;margin:6px auto 0;border-radius:50%;
  border:1px solid var(--line);background:radial-gradient(circle,var(--panel2) 0 33%,transparent 34%),var(--panel)}
.gball::before,.gball::after{content:"";position:absolute;background:var(--line)}
.gball::before{left:50%;top:0;bottom:0;width:1px}.gball::after{top:50%;left:0;right:0;height:1px}
.gdot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);left:50%;top:50%;box-shadow:0 0 10px var(--accent)}
.gtxt{text-align:center;font-size:12px;color:var(--dim);margin-top:4px}
.pbar{height:8px;background:var(--panel2);border-radius:4px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent)}
details{margin-top:8px}
summary{color:var(--dim);font-size:13px;padding:8px 2px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:4px 6px;border-bottom:1px solid var(--line)} td:nth-child(2){text-align:right}
td .lv{font-size:10px;margin-left:6px;padding:1px 5px;border-radius:6px;background:var(--panel2)}
tr.l1 .lv{color:var(--ok)} tr.l2 .lv{color:var(--accent)} tr.l3 .lv{color:var(--cand)} tr.l4 .lv,tr.l4 td{color:var(--dim)}
tr.s td{color:var(--faint)}
/* 블루투스로 볼 때: 노트북 전용 기능(기록·분석·업로드·전체표)은 숨김 */
body.esp .btns, body.esp details{display:none}
body.esp{padding-bottom:calc(env(safe-area-inset-bottom) + 76px)}
#bleBtn{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:var(--accent);color:#fff;z-index:5}
.btns{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(transparent,var(--bg) 30%);display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px}
button{font:inherit;font-weight:650;border:0;border-radius:12px;padding:14px 4px;color:var(--text);background:var(--panel2);min-height:52px}
button:active{transform:scale(.97)}
#recBtn{background:#2a1416;color:#ff7a7a} #recBtn.on{background:var(--hot);color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
#modal.on{display:flex}
#modal .box{background:var(--panel);width:100%;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px)}
#modal pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--text);margin:0 0 12px}
#modal button{width:100%}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;z-index:10;max-width:90%}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="bar"><span class="dot" id="dot"></span><span id="src" class="num">연결 중…</span>
  <span class="rec" id="rec"><i></i><span id="recTxt" class="num">REC</span></span></div>

<div class="card">
  <div class="hero">
    <div><span class="rpm num" id="rpm">—</span><span class="unit">rpm</span>
      <div class="spd num"><span id="spd">—</span><span class="unit">km/h</span></div></div>
    <div class="gear" id="gear">—</div>
  </div>
  <div class="shift" id="shift"></div>
  <div class="scale num"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div>
</div>

<div class="grid">
  <div class="t" id="t_oil"><div class="l">유온</div><div class="v num">—</div></div>
  <div class="t" id="t_coolant"><div class="l">수온</div><div class="v num">—</div></div>
  <div class="t strong" id="t_intake"><div class="l">흡기온</div><div class="v num">—</div></div>
  <div class="t strong" id="t_boost"><div class="l">부스트</div><div class="v num">—</div>
    <div class="tbar"><i id="boostbar"></i></div></div>
  <div class="t" id="t_batt"><div class="l">배터리</div><div class="v num">—</div></div>
  <div class="t" id="t_steer"><div class="l">조향각</div>
    <div class="wheelrow"><svg class="wheel" id="wheel" viewBox="-50 -50 100 100" aria-hidden="true">
      <circle r="42" fill="none" stroke="currentColor" stroke-width="9"/>
      <circle r="11" fill="currentColor"/>
      <path d="M-11 0 H-38 M11 0 H38 M0 11 V38" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
      <rect x="-4" y="-50" width="8" height="12" rx="2" fill="var(--hot)"/>
    </svg><span class="v num" id="steerv">—</span></div></div>
</div>
</div>

<div class="row2">
  <div class="card"><div class="l" style="font-size:11px;color:var(--dim)">TPMS psi</div>
    <div class="tp">
      <div class="tire" id="fl"><b class="num">—</b><small>앞 좌</small></div>
      <div class="tire" id="fr"><b class="num">—</b><small>앞 우</small></div>
      <div class="tire" id="rl"><b class="num">—</b><small>뒤 좌</small></div>
      <div class="tire" id="rr"><b class="num">—</b><small>뒤 우</small></div></div></div>
  <div class="card"><div class="l" style="font-size:11px;color:var(--dim)">G</div>
    <div class="gball"><div class="gdot" id="gdot"></div></div>
    <div class="gtxt num" id="gtxt">—</div></div>
</div>

<div class="card" style="margin-top:8px">
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim)"><span>엑셀</span><span class="num" id="pedal">—</span></div>
  <div class="pbar"><i id="pbar"></i></div>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:10px"><span>브레이크</span><span class="num" id="brake">—</span></div>
  <div class="pbar"><i id="bbar" style="background:var(--hot)"></i></div>
</div>

<details><summary>전체 신호 (맞을 확률 순: 확정 → 유력 → 후보 → 약함)</summary><table id="tbl"></table></details>

<div class="btns">
  <button id="recBtn">● 기록</button>
  <button id="markBtn">표시</button>
  <button id="anaBtn">분석</button>
  <button id="pushBtn">업로드</button>
</div>

<div id="modal"><div class="box"><pre id="mtext"></pre><button id="mclose">닫기</button></div></div>
<button id="bleBtn" style="display:none">블루투스 연결</button>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const MAX_RPM = 7000, SEG = 28;            // RPM 바: 0~7000 을 28칸(250rpm/칸)
const YELLOW = 5000, RED = 6000, FLASH = 6500;
const BOOST_MAX = 1.5;
const TPMS_BAD = 26, TPMS_LO = 30, TPMS_HI = 42;   // psi 경고 기준
const STEER_SIGN = 1;                      // 핸들 그림 회전 방향 (반대로 돌면 -1)                     // 부스트 바 최대 (bar)   // 색 바뀌는 지점, 깜빡임(변속 시점)
const shift = $("shift");
for (let i = 0; i < SEG; i++) shift.appendChild(document.createElement("b"));
let recording = false, busy = false;
const LV = { "확정": 1, "유력": 2, "후보": 3, "약함": 4 };   // 맞을 확률 순

function fmt(v, d) { return v === null || v === undefined ? "—" : (typeof v === "number" ? v.toFixed(d) : v); }
function tile(id, v, d, unit, warn, hot) {
  const el = $("t_" + id); if (!el) return;
  el.querySelector(".v").innerHTML = fmt(v, d) + (v === null || v === undefined ? "" : `<span class="unit">${unit}</span>`);
  el.classList.toggle("warn", typeof v === "number" && warn !== undefined && v >= warn && !(hot !== undefined && v >= hot));
  el.classList.toggle("hot", typeof v === "number" && hot !== undefined && v >= hot);
}
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2500); }
function modal(m) { $("mtext").textContent = m; $("modal").classList.add("on"); }
$("mclose").onclick = () => $("modal").classList.remove("on");

function render(s) {
  if (s.esp) document.body.classList.add("esp");
  const k = s.k;
  $("dot").className = "dot " + (s.fps > 0 ? "on" : "off");
  $("src").textContent = s.esp ? `${s.src} · ESP32 ${s.fps}/s` : `${s.src} · ${s.fps}/s · 지연 ${s.lag_ms}ms`;
  recording = s.recording;
  $("rec").classList.toggle("on", recording);
  const mm = String(Math.floor(s.rec_sec / 60)).padStart(2, "0"), ss = String(s.rec_sec % 60).padStart(2, "0");
  $("recTxt").textContent = `${s.rec_name} ${mm}:${ss}`;
  $("recBtn").classList.toggle("on", recording);
  $("recBtn").textContent = recording ? "■ 정지" : "● 기록";

  $("rpm").textContent = fmt(k.rpm, 0);
  $("spd").textContent = fmt(k.speed, 0);
  $("gear").textContent = k.gear ?? "—";
  const r = k.rpm || 0, bars = shift.children;
  const lit = Math.max(0, Math.min(SEG, Math.ceil(r / MAX_RPM * SEG)));
  for (let i = 0; i < SEG; i++) {
    const at = (i + 1) * MAX_RPM / SEG;   // 이 칸이 나타내는 rpm
    bars[i].className = i < lit ? (at <= YELLOW ? "g" : at <= RED ? "y" : "r") : "";
  }
  shift.classList.toggle("flash", r >= FLASH);

  tile("oil", k.oil, 1, "°C", 115, 130);
  tile("coolant", k.coolant, 1, "°C", 105, 112);
  tile("intake", k.intake, 1, "°C", 55, 70);
  tile("batt", k.batt, 1, "V");
  tile("boost", k.boost, 2, "bar");
  // 핸들: 조향각만큼 회전 (센서 + = 왼쪽 가정 → 화면에서는 반시계). 방향이 반대면 STEER_SIGN 을 -1 로
  $("wheel").style.transform = `rotate(${-STEER_SIGN * (k.steer || 0)}deg)`;
  $("steerv").innerHTML = k.steer == null ? "—" : `${Math.abs(k.steer).toFixed(0)}<span class="unit">° ${k.steer > 1 ? "좌" : k.steer < -1 ? "우" : ""}</span>`;
  $("boostbar").style.width = Math.max(0, Math.min(100, (k.boost || 0) / BOOST_MAX * 100)) + "%";   // 0 ~ BOOST_MAX bar
  for (const w of ["fl", "fr", "rl", "rr"]) {
    const v = k["tpms_" + w], el = $(w);
    el.querySelector("b").textContent = fmt(v, 0);
    // 색: 정상 초록 / 낮거나 높음 노랑 / 아주 낮음 빨강(깜빡임)
    el.className = "tire " + (v == null ? "" : v < TPMS_BAD ? "bad" : v < TPMS_LO ? "lo" : v > TPMS_HI ? "hi" : "ok");
  }

  const lat = k.latg || 0, lon = k.long || 0, G = 1.0;
  $("gdot").style.left = (50 + Math.max(-1, Math.min(1, -lat / G)) * 46) + "%";
  $("gdot").style.top = (50 + Math.max(-1, Math.min(1, -lon / G)) * 46) + "%";
  $("gtxt").textContent = `횡 ${fmt(k.latg, 2)} · 종 ${fmt(k.long, 2)}`;
  $("pedal").textContent = fmt(k.pedal, 0) + (k.pedal == null ? "" : " %");
  $("pbar").style.width = Math.max(0, Math.min(100, k.pedal || 0)) + "%";
  $("brake").textContent = fmt(k.brake, 0) + (k.brake == null ? "" : " bar");
  $("bbar").style.width = Math.max(0, Math.min(100, k.brake || 0)) + "%";   // 0~100 bar

  if (s.signals && $("tbl").closest("details").open)
    $("tbl").innerHTML = s.signals
      .map((r, i) => [LV[r[3]] || 9, i, r]).sort((a, b) => a[0] - b[0] || a[1] - b[1])
      .map(([lv, , [n, v, u, st, stale]]) =>
        `<tr class="l${lv} ${stale ? "s" : ""}"><td>${n}<span class="lv">${st}</span></td><td class="num">${fmt(v, 2)} ${u}</td></tr>`).join("");
}

// 두 가지 모드
//  - 노트북 서버(http://…:8080): SSE 로 초당 15번 받음. 기록·분석·업로드 버튼 사용.
//  - 블루투스(https GitHub Pages, 아이폰 Bluefy 앱): ESP32 "CN7-DASH" 에 BLE 로 연결해 받음. 보기 전용.
const BLE_MODE = location.protocol === "https:";
const BLE_SVC = "6e400001-c3a7-4b1e-9d2a-0c3e5a7f1001";   // 펌웨어 dash_ble.h 와 같아야 함
const BLE_CHR = "6e400002-c3a7-4b1e-9d2a-0c3e5a7f1001";
const details = $("tbl").closest("details");
let es = null, lastMsg = 0;

function connect() {
  if (BLE_MODE) return;
  if (es) es.close();
  es = new EventSource("/api/stream" + (details.open ? "?full=1" : ""));
  es.onmessage = e => { lastMsg = Date.now(); render(JSON.parse(e.data)); };
}

// BLE 패킷(29바이트) → 화면 값. 펌웨어 DashPkt 구조와 짝
function decodePacket(dv) {
  const v = dv.getUint16(1, true), has = b => (v >> b) & 1;
  const g = String.fromCharCode(dv.getUint8(6)) + (dv.getUint8(7) ? String.fromCharCode(dv.getUint8(7)) : "");
  const k = {
    rpm: has(0) ? dv.getUint16(3, true) : null,
    speed: has(1) ? dv.getUint8(5) : null,
    gear: has(2) ? (/^[1-7]$/.test(g) ? +g : g) : null,
    coolant: has(3) ? dv.getInt16(8, true) / 10 : null,
    oil: has(4) ? dv.getInt16(10, true) / 10 : null,
    intake: has(5) ? dv.getInt16(12, true) / 10 : null,
    batt: has(6) ? dv.getUint8(14) / 10 : null,
    boost: has(7) ? dv.getInt16(15, true) / 100 : null,
    steer: has(8) ? dv.getInt16(17, true) / 10 : null,
    latg: has(9) ? dv.getInt8(19) / 100 : null,
    long: has(9) ? dv.getInt8(20) / 100 : null,
    pedal: has(10) ? dv.getUint8(21) : null,
    brake: has(11) ? dv.getUint8(22) : null,
  };
  ["fl", "fr", "rl", "rr"].forEach((w, i) => k["tpms_" + w] = has(12) ? dv.getUint8(23 + i) : null);
  return { esp: true, src: "블루투스", fps: dv.getUint16(27, true), lag_ms: 0, recording: false, rec_name: "", rec_sec: 0, k };
}

let bleDev = null;
async function bleConnect() {
  try {
    if (!bleDev) {
      // 서비스 UUID 또는 이름 "CN7-DASH" 로 찾음 (어느 쪽이 광고에 보이든 잡히게)
      bleDev = await navigator.bluetooth.requestDevice({
        filters: [{ services: [BLE_SVC] }, { name: "CN7-DASH" }, { namePrefix: "CN7" }],
        optionalServices: [BLE_SVC] });
      bleDev.addEventListener("gattserverdisconnected", () => { toast("블루투스 끊김 · 다시 연결 중"); setTimeout(bleConnect, 1000); });
    }
    const srv = await bleDev.gatt.connect();
    const chr = await (await srv.getPrimaryService(BLE_SVC)).getCharacteristic(BLE_CHR);
    chr.addEventListener("characteristicvaluechanged", e => { lastMsg = Date.now(); render(decodePacket(e.target.value)); });
    await chr.startNotifications();
    $("bleBtn").style.display = "none";
    toast("블루투스 연결됨");
  } catch (e) {
    $("bleBtn").style.display = "";
    toast("연결 실패: " + (e.message || e));
  }
}

if (BLE_MODE) {
  document.body.classList.add("esp");
  if (!navigator.bluetooth) modal("이 브라우저는 블루투스를 지원하지 않아요. 아이폰에서는 'Bluefy' 앱으로 이 주소를 여세요.");
  $("bleBtn").style.display = "";
  $("bleBtn").onclick = bleConnect;   // 블루투스 연결은 버튼을 눌러야만 시작 가능(브라우저 규칙)
} else {
  details.addEventListener("toggle", connect);
}
setInterval(() => {   // 2초 넘게 소식 없으면 끊김 표시 (+ 노트북 모드는 다시 연결)
  if (Date.now() - lastMsg > 2000) {
    $("dot").className = "dot off";
    $("src").textContent = BLE_MODE ? "블루투스 연결 안 됨" : "노트북 연결 끊김 · 재연결 중";
    connect();
  }
}, 2000);
connect();

async function api(path, body, long) {
  if (busy) return; busy = true;
  if (long) toast("처리 중…");
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    return (await r.json()).msg;
  } catch (e) { return "실패: 노트북 연결 확인"; }
  finally { busy = false; }
}
$("recBtn").onclick = async () => {
  if (recording) { toast(await api("/api/rec/stop")); return; }
  const name = prompt("기록 이름 (비우면 자동, 예: d3_drive)", "") ;
  if (name === null) return;
  toast(await api("/api/rec/start", { name }));
};
$("markBtn").onclick = async () => toast(await api("/api/mark", { label: "MARK" }));
$("anaBtn").onclick = async () => modal(await api("/api/analyze", {}, true));
$("pushBtn").onclick = async () => {
  if (!confirm("방금 기록을 GitHub에 올릴까요?")) return;
  modal(await api("/api/push", {}, true));
};
</script>
</body>
</html>
